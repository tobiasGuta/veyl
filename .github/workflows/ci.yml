name: Rust validation (Fedora 45)

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          dnf install -y rust cargo gcc pkgconf-pkg-config gtk4-devel vte291-gtk4-devel
          pkg-config --modversion gtk4
          pkg-config --modversion vte-2.91-gtk4
      - name: Unit tests and compile
        run: cargo test
      - name: Debug build
        run: cargo build
      # The Codex handoff requires adding Cargo.lock, rustfmt and clippy gates.
      # Do not label the v0.1 release verified until those gates are added and pass.
