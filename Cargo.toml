[package]
name = "veyl"
version = "0.1.0"
edition = "2021"
description = "A Fedora-native terminal with a Windows Terminal-inspired dark interface"
repository = "https://github.com/tobiasGuta/veyl"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gdk4-wayland = "0.11"
vte4 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
