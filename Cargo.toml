[package]
name = "veyl"
version = "0.1.0"
edition = "2021"
description = "A Fedora-native terminal with a Windows Terminal-inspired dark interface"
repository = "https://github.com/tobiasGuta/veyl"
license = "MIT"
publish = false

[features]
graphics-prototype = []

[dependencies]
libc = "0.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gdk4-wayland = "0.11"
vte4 = { version = "0.10", features = ["v0_80"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
